name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: python -m pytest tests -q
      - name: Smoke — simulated demo account (live code path, no terminal)
        run: |
          python -m moneyminter demo --symbols EUR/USD \
            --timeframe M5 --polls 400 --bars 800 --json /tmp/demo.json
      - name: Smoke — backtest, walk-forward and validation
        run: |
          python -m moneyminter backtest --strategy donchian_trend --bars 1200
          python -m moneyminter walkforward --strategy donchian_trend --folds 3 --bars 1500
          python -m moneyminter validate --strategy donchian_trend --samples 4 --bars 1200
